seed: 42
name: M2_action_tokenizer

wandb:
  project: "M2_action_tokenizer"
  api_key: 'your key'

device_num: 8
optim:
  lr: 5e-5
  weight_decay: 2e-4
  betas: [0.9 0.999]

max_grad_norm: 1.0
epochs: 200
save_every_epoch: 30
batch_size: 1024
train_data_path: './RoboTwin_actions_chunk_8.pkl'

data_scale: 1.0

save_every: 10
save_path: "./ckpts_200/"
vqvae_model:
  recon_loss_weight: 1
  down_t: 2
  action_chunk_num: 8
  action_dim: 7
  codebook_dim: 2048
  codebook_size: 2048
  n_latent_dims: 512
  num_codebooks: 8
